name: BugSmash review version

# Every successful non-production Vercel deployment becomes a new version of the
# BugSmash review project, so reviewers always comment on the latest preview.
# Uses the REST API with an API key: CI cannot complete the MCP OAuth flow.
# See docs/bugsmash-mcp.md.

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: Website URL to capture as a new review version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bugsmash-review-${{ github.event.deployment_status.environment_url || github.event.inputs.url }}
  cancel-in-progress: true

jobs:
  add-version:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment != 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUGSMASH_API_KEY: ${{ secrets.BUGSMASH_API_KEY }}
      BUGSMASH_PROJECT_ID: ${{ secrets.BUGSMASH_PROJECT_ID }}
      PREVIEW_URL: ${{ github.event.deployment_status.environment_url || github.event.inputs.url }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "$BUGSMASH_API_KEY" ] || [ -z "$BUGSMASH_PROJECT_ID" ]; then
            echo "::warning::BUGSMASH_API_KEY or BUGSMASH_PROJECT_ID is not configured; skipping the BugSmash review version."
            exit 0
          fi
          case "$PREVIEW_URL" in
            http://*|https://*) ;;
            *)
              echo "::warning::No preview URL for this deployment; skipping the BugSmash review version."
              exit 0
              ;;
          esac
          echo "READY=1" >> "$GITHUB_ENV"

      - name: Add preview as a review version
        if: env.READY == '1'
        run: |
          set -euo pipefail
          payload=$(jq -n --arg url "$PREVIEW_URL" --arg projectId "$BUGSMASH_PROJECT_ID" \
            '{websiteUrl: $url, projectId: $projectId}')
          code=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST https://api.bugsmash.io/api/v2/version \
            -H "X-API-Key: $BUGSMASH_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "$payload")
          echo "BugSmash responded with HTTP $code"
          cat response.json
          echo
          if [ "$code" -ge 400 ] || [ "$(jq -r '.status // false' response.json)" != "true" ]; then
            echo "::error::BugSmash did not accept the new version (HTTP $code)."
            exit 1
          fi
          link=$(jq -r '.version.review_link // empty' response.json)
          {
            echo "### BugSmash review version"
            echo "- Preview: $PREVIEW_URL"
            echo "- Review link: ${link:-not returned}"
          } >> "$GITHUB_STEP_SUMMARY"
